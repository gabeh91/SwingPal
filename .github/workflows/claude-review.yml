# Reviews every ready (non-draft) PR as claude[bot] through the Claude GitHub app.
# Needs the Claude GitHub app installed on this repo and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`). Agentcy parses the verdict heading below, so
# keep "### Claude review: ✅ Approve" / "### Claude review: ❌ Changes requested"
# and the "Reviewed head: <sha>" line exactly as written.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}

            You are the cloud reviewer for this PR. The PR head is checked out in the
            working directory. First read any CLAUDE.md or AGENTS.md at the repo root
            and the PR body, and hold the PR to the rules they set.

            Review the diff (`gh pr diff`, `git diff BASE_SHA...HEAD_SHA`) for correctness
            bugs, broken project rules, missing or hollow tests, security problems and
            risky logic. Say plainly what you could not verify on this runner.
            If this PR already has earlier "### Claude review:" comments, say this is a
            re-review and check each earlier finding against the new head.

            Post exactly ONE top-level comment with `gh pr comment`, in this format
            (Agentcy parses the first two lines, so keep them byte-for-byte):

            ### Claude review: ✅ Approve
            Reviewed head: <full HEAD SHA>

            or

            ### Claude review: ❌ Changes requested
            Reviewed head: <full HEAD SHA>

            then a blank line, a **Checks** list (what you ran or read, with results),
            and, for changes requested, a **Findings** list where each item starts with
            **major:**, **minor:** or **nit:** and cites `file:line`. Approve when only
            nits remain. Optionally add inline comments with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            Only post GitHub comments; don't reply with review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
